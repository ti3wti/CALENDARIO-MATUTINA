<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revista Matutina – Calendario de Emisiones</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;600;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --azul:      #1a3a5c;
    --azul-med:  #2563a8;
    --azul-claro:#dce8f7;
    --acento:    #e8a020;
    --texto:     #1a2535;
    --gris-claro:#f0f4f8;
    --domingo-bg:#fff4e0;
    --hoy-color: #2563a8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Source Sans 3', sans-serif;
    background: var(--gris-claro);
    color: var(--texto);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--azul);
    color: #fff;
    padding: 18px 24px 14px;
    display: flex;
    align-items: baseline;
    gap: 18px;
    flex-wrap: wrap;
  }
  header h1 {
    font-family: 'Oswald', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 1px;
  }
  header .sub {
    font-family: 'Oswald', sans-serif;
    font-size: 1.1rem;
    font-weight: 300;
    color: #a8c4e0;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .nav-mes {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .nav-mes button {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    font-family: 'Oswald', sans-serif;
    font-size: 1.1rem;
    padding: 5px 14px;
    border-radius: 4px;
    cursor: pointer;
    transition: background .2s;
  }
  .nav-mes button:hover { background: rgba(255,255,255,0.28); }
  .nav-mes .mes-label {
    font-family: 'Oswald', sans-serif;
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: 1px;
    min-width: 160px;
    text-align: center;
  }

  /* ── EMISIÓN HOY ── */
  .hoy-banner {
    background: var(--azul-med);
    color: #fff;
    text-align: center;
    padding: 10px 16px;
    font-family: 'Oswald', sans-serif;
    font-size: 1.05rem;
    letter-spacing: 1px;
  }
  .hoy-banner span {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--acento);
    margin: 0 6px;
  }

  /* ── LEYENDA CLUBS ── */
  .leyenda {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 16px;
    background: #fff;
    border-bottom: 1px solid #d0dce8;
    justify-content: center;
  }
  .leyenda-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: .8rem;
    color: #444;
  }
  .leyenda-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
  }

  /* ── GRILLA CALENDARIO ── */
  .cal-wrap {
    padding: 16px;
    max-width: 1000px;
    margin: 0 auto;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }

  .cal-dia-hdr {
    font-family: 'Oswald', sans-serif;
    font-size: .85rem;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-align: center;
    color: var(--azul);
    padding: 6px 0;
    border-bottom: 2px solid var(--azul-claro);
  }
  .cal-dia-hdr.domingo { color: var(--acento); }

  .celda {
    background: #fff;
    border-radius: 8px;
    padding: 8px 6px 10px;
    min-height: 90px;
    border: 1px solid #d8e4f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    transition: box-shadow .15s;
    position: relative;
  }
  .celda:hover { box-shadow: 0 3px 12px rgba(37,99,168,.15); }

  .celda.vacia {
    background: transparent;
    border-color: transparent;
    pointer-events: none;
  }

  .celda.es-domingo {
    background: var(--domingo-bg);
    border-color: #f0d090;
  }

  /* HOY */
  .celda.es-hoy {
    border: 2px solid var(--hoy-color);
    animation: pulso-hoy 2s ease-in-out infinite;
  }
  @keyframes pulso-hoy {
    0%, 100% { background: #fff;    box-shadow: 0 0 0 3px rgba(37,99,168,.18); }
    50%       { background: #fff8d0; box-shadow: 0 0 0 7px rgba(37,99,168,.07); }
  }
  .celda.es-domingo.es-hoy {
    animation: pulso-hoy-dom 2s ease-in-out infinite;
  }
  @keyframes pulso-hoy-dom {
    0%, 100% { background: var(--domingo-bg); box-shadow: 0 0 0 3px rgba(37,99,168,.18); }
    50%       { background: #fff8d0;           box-shadow: 0 0 0 7px rgba(37,99,168,.07); }
  }

  .num-dia {
    font-size: .9rem;
    font-weight: 600;
    color: #556;
    align-self: flex-start;
    margin-left: 2px;
    line-height: 1;
  }
  .celda.es-hoy .num-dia { color: var(--hoy-color); font-weight: 700; }

  .num-emision {
    font-family: 'Oswald', sans-serif;
    font-size: 1.55rem;
    font-weight: 600;
    color: var(--azul-med);
    line-height: 1;
    margin-top: 4px;
  }
  .celda.es-hoy .num-emision {
    color: var(--hoy-color);
    font-size: 1.7rem;
    font-weight: 700;
  }

  /* Badge club */
  .badge-club {
    font-size: .62rem;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    letter-spacing: .5px;
    padding: 2px 6px;
    border-radius: 3px;
    color: #fff;
    margin-top: 2px;
    text-align: center;
    line-height: 1.3;
    width: 100%;
  }
  .club-ti0rc   { background: #b03a2e; }
  .club-ti0arc  { background: #1a7a4a; }
  .club-ti0trc  { background: #7d3c98; }
  .club-ti0rhu  { background: #1a5276; }
  .club-ecos    { background: #a04000; }

  /* Etiqueta evento especial */
  .evento {
    font-size: .58rem;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    letter-spacing: .3px;
    color: #c0392b;
    background: #fdecea;
    border: 1px solid #e57373;
    border-radius: 3px;
    padding: 1px 4px;
    margin-top: 3px;
    text-align: center;
    width: 100%;
    line-height: 1.3;
  }

  /* Indicador HOY en badge */
  .celda.es-hoy .badge-club {
    outline: 2px solid var(--hoy-color);
    outline-offset: 1px;
  }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 14px;
    font-size: .78rem;
    color: #7a90a8;
    border-top: 1px solid #d0dce8;
    margin-top: 10px;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    header { padding: 12px 10px 10px; gap: 8px; }
    header h1 { font-size: 1.2rem; }
    header .sub { font-size: .75rem; letter-spacing: 1px; }
    .nav-mes button { padding: 4px 10px; font-size: .95rem; }
    .nav-mes .mes-label { font-size: 1rem; min-width: 110px; }

    .hoy-banner { font-size: .82rem; padding: 8px 8px; }
    .hoy-banner span { font-size: 1.2rem; }

    .leyenda { gap: 4px; padding: 6px 8px; }
    .leyenda-item { font-size: .68rem; }

    .cal-wrap { padding: 6px 4px; }
    .cal-grid { gap: 2px; }

    .cal-dia-hdr { font-size: .6rem; letter-spacing: 0; padding: 4px 0; }

    .celda { min-height: 62px; padding: 3px 2px 4px; border-radius: 5px; }
    .num-dia { font-size: .65rem; }
    .num-emision { font-size: .95rem; margin-top: 2px; }
    .celda.es-hoy .num-emision { font-size: 1.05rem; }

    .badge-club { font-size: .48rem; padding: 1px 2px; border-radius: 2px; line-height: 1.2; }
  }

  @media (max-width: 380px) {
    .num-emision { font-size: .82rem; }
    .badge-club { font-size: .42rem; }
    .cal-dia-hdr { font-size: .52rem; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Revista Matutina</h1>
    <div class="sub">Calendario de Emisiones</div>
  </div>
  <div class="nav-mes">
    <button onclick="cambiarMes(-1)">&#8592;</button>
    <div class="mes-label" id="mesLabel"></div>
    <button onclick="cambiarMes(1)">&#8594;</button>
  </div>
</header>

<div class="hoy-banner" id="hoyBanner">
  Cargando…
</div>

<div class="leyenda">
  <div class="leyenda-item"><span class="leyenda-dot" style="background:#b03a2e"></span> TI0RC – Radio Club Costa Rica (1°)</div>
  <div class="leyenda-item"><span class="leyenda-dot" style="background:#1a7a4a"></span> TI0ARC – R.A. Cartago (2°)</div>
  <div class="leyenda-item"><span class="leyenda-dot" style="background:#7d3c98"></span> TI0TRC – Turrialba R.C. (3°)</div>
  <div class="leyenda-item"><span class="leyenda-dot" style="background:#1a5276"></span> TI0RHU – R.A. Herediana (4°)</div>
  <div class="leyenda-item"><span class="leyenda-dot" style="background:#a04000"></span> Ecos del Norte (5°)</div>
</div>

<div class="cal-wrap">
  <div class="cal-grid" id="calGrid"></div>
</div>

<footer id="pie">Calendario generado automáticamente · Revista Matutina</footer>

<script>
// ── CONFIG BASE ──────────────────────────────────────────────
const BASE_EMISION = 7832;
const BASE_FECHA   = new Date(2026, 4, 21); // 21 mayo 2026 (mes 0-indexed)

const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
               'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS_HDR = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];

const CLUBS = [
  { indicativo:'TI0RC',  nombre:'Radio Club C.R.', clase:'club-ti0rc'  },
  { indicativo:'TI0ARC', nombre:'Cartago',          clase:'club-ti0arc' },
  { indicativo:'TI0TRC', nombre:'Turrialba',        clase:'club-ti0trc' },
  { indicativo:'TI0RHU', nombre:'Heredia',          clase:'club-ti0rhu' },
  { indicativo:'Ecos del Norte', nombre:'',         clase:'club-ecos'   },
];

// Estado
let ajuste = 0;      // viene de config.json
let mesVista, anioVista;

// ── EVENTOS ESPECIALES ───────────────────────────────────────
// Formato: 'YYYY-MM-DD': 'Texto del evento'
const EVENTOS = {
  '2026-06-20': 'Asamblea TI0RHU',
};


function diasDesdeBase(fecha) {
  const ms = Date.UTC(fecha.getFullYear(), fecha.getMonth(), fecha.getDate())
           - Date.UTC(BASE_FECHA.getFullYear(), BASE_FECHA.getMonth(), BASE_FECHA.getDate());
  return Math.round(ms / 86400000);
}

function emisionDe(fecha) {
  return BASE_EMISION + diasDesdeBase(fecha) + ajuste;
}

function clubDomingo(fecha) {
  // Semana del domingo en el mes (1ª, 2ª, 3ª, 4ª, 5ª)
  const semana = Math.ceil(fecha.getDate() / 7);
  return CLUBS[Math.min(semana - 1, 4)];
}

function esMismoDia(a, b) {
  return a.getFullYear() === b.getFullYear() &&
         a.getMonth()    === b.getMonth()    &&
         a.getDate()     === b.getDate();
}

// ── RENDER ───────────────────────────────────────────────────
function renderCalendario() {
  const hoy    = new Date();
  const grid   = document.getElementById('calGrid');
  grid.innerHTML = '';

  // Cabeceras
  DIAS_HDR.forEach((d, i) => {
    const hdr = document.createElement('div');
    hdr.className = 'cal-dia-hdr' + (i === 6 ? ' domingo' : '');
    hdr.textContent = d;
    grid.appendChild(hdr);
  });

  // Primer día del mes (ajustado a semana lun=0)
  const primero  = new Date(anioVista, mesVista, 1);
  const offset   = (primero.getDay() + 6) % 7; // lun=0 … dom=6
  const diasMes  = new Date(anioVista, mesVista + 1, 0).getDate();

  // Celdas vacías iniciales
  for (let v = 0; v < offset; v++) {
    const vacia = document.createElement('div');
    vacia.className = 'celda vacia';
    grid.appendChild(vacia);
  }

  // Días del mes
  for (let d = 1; d <= diasMes; d++) {
    const fecha   = new Date(anioVista, mesVista, d);
    const esDom   = fecha.getDay() === 0;
    const esHoy   = esMismoDia(fecha, hoy);
    const emision = emisionDe(fecha);

    const celda = document.createElement('div');
    celda.className = 'celda'
      + (esDom   ? ' es-domingo' : '')
      + (esHoy   ? ' es-hoy'     : '');

    // Número de día
    const ndCont = document.createElement('div');
    ndCont.className = 'num-dia';
    ndCont.textContent = d;
    celda.appendChild(ndCont);

    // Número de emisión
    const ne = document.createElement('div');
    ne.className = 'num-emision';
    ne.textContent = emision;
    celda.appendChild(ne);

    // Badge club (solo domingos)
    if (esDom) {
      const club = clubDomingo(fecha);
      const badge = document.createElement('div');
      badge.className = 'badge-club ' + club.clase;
      badge.innerHTML = club.nombre ? club.indicativo + '<br>' + club.nombre : club.indicativo;
      celda.appendChild(badge);
    }

    // Evento especial
    const claveEvento = `${anioVista}-${String(mesVista+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if (EVENTOS[claveEvento]) {
      const ev = document.createElement('div');
      ev.className = 'evento';
      ev.textContent = EVENTOS[claveEvento];
      celda.appendChild(ev);
    }

    grid.appendChild(celda);
  }

  // Label mes
  document.getElementById('mesLabel').textContent =
    MESES[mesVista] + ' ' + anioVista;

  // Banner de hoy
  actualizarBanner(hoy);
}

function actualizarBanner(hoy) {
  const emHoy = emisionDe(hoy);
  const esDom  = hoy.getDay() === 0;
  let club = '';
  if (esDom) {
    const c = clubDomingo(hoy);
    club = ` · <strong>${c.indicativo}</strong> – ${c.nombre}`;
  }
  document.getElementById('hoyBanner').innerHTML =
    `Hoy ${hoy.getDate()} de ${MESES[hoy.getMonth()]} ${hoy.getFullYear()} · Emisión <span>${emHoy}</span>${club}`;
}

function cambiarMes(delta) {
  mesVista += delta;
  if (mesVista > 11) { mesVista = 0;  anioVista++; }
  if (mesVista < 0)  { mesVista = 11; anioVista--; }
  renderCalendario();
}

// ── CARGA CONFIG.JSON ────────────────────────────────────────
async function cargarConfig() {
  try {
    const r = await fetch('config.json?_=' + Date.now());
    if (r.ok) {
      const cfg = await r.json();
      if (typeof cfg.ajuste === 'number') ajuste = cfg.ajuste;
    }
  } catch (_) { /* sin config.json → ajuste=0 */ }
}

// ── INIT ─────────────────────────────────────────────────────
(async () => {
  await cargarConfig();
  const hoy  = new Date();
  mesVista   = hoy.getMonth();
  anioVista  = hoy.getFullYear();
  renderCalendario();
})();
</script>
</body>
</html>
